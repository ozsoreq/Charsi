name: Build APK

on:
  push:
    branches:
      - claude/flutter-character-customizer-Gww0Z
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: charsi
        run: flutter pub get

      - name: Build debug APK
        working-directory: charsi
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: charsi-debug
          path: charsi/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
